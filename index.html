<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/opt/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/opt/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <!-- title is a fallback only: react-helmet-async replaces it per route.
         Per-page description / canonical / og:url / og:title / og:description /
         twitter:title / twitter:description are set by each page's <Helmet> and are
         intentionally NOT duplicated here (a static canonical would add a second,
         homepage-pointing canonical to every route and break indexing). -->
    <title>STRIATA | Research-Grade Peptides South Africa</title>
    <meta name="keywords" content="peptides South Africa, research peptides, BPC-157, TB-500, semaglutide, tirzepatide, GHK-Cu, nootropics, anti-aging peptides, buy peptides SA, Johannesburg peptides" />

    <!-- Open Graph (global defaults; per-page og:title/description/url come from Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STRIATA" />
    <meta property="og:image" content="https://www.striatalabs.co.za/assets/opt/og-image.jpg" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card (global defaults; per-page title/description fall back to og:*) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.striatalabs.co.za/assets/opt/og-image.jpg" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "STRIATA",
      "url": "https://www.striatalabs.co.za",
      "logo": "https://www.striatalabs.co.za/assets/opt/logo-640.png",
      "description": "South Africa's premier source for research-grade peptides. 99%+ purity guaranteed.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Johannesburg",
        "addressRegion": "Gauteng",
        "addressCountry": "ZA"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+27-78-213-7905",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      "email": "info@striatalabs.co.za",
      "sameAs": [
        "https://instagram.com/striata.za",
        "https://tiktok.com/@striata.za"
      ]
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "STRIATA",
      "url": "https://www.striatalabs.co.za"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
